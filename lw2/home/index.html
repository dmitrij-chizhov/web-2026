<!DOCTYPE html>
<html>
    <head>
        <title>Home</title>
        <meta charset="UTF-8">
        <link href="./home.css" rel="stylesheet">
        <link href="../font/font.css" rel="stylesheet">
    </head>
    <body>
        <div class="page">
            <nav class="page__menu">
                <a href="#" title="Home">
                    <img src="../images/home.png" class="menu__image-service" alt="Home" height="40" width="40">
                </a>
                <a href="/profile" title="Profile">
                    <img src="../images/profile.png" class="menu__image-service" alt="Profile" height="40" width="40">
                </a>
                <a href="#" title="Plus">
                    <img src="../images/plus.png" class="menu__image-service" alt="Plus" height="40" width="40">
                </a>              
            </nav>
            <div class="page__main-content">
                <div class="main-content__post">
                    <div class="post__info">
                        <img src="../images/avatar-vania.png" class="info__image-avatar" alt="Avatar Vania" height="32" width="32">
                        <p class="info__text-avatar">Ваня Денисов</p>
                        <img src="../images/edit.png" class="info__image-edit" alt="Edit" height="24" width="24">
                    </div>
                    <div class="post__content">
                        <img src="../images/photo1.png" class="content__image" alt="Post photo" height="474" width="474">
                        <p class="content__number-of-photo">1/3</p>
                        <button class="content__reaction">
                            <img src="../images/like.png" class="content__image-reaction" alt="like" height="16" width="16">
                            203
                        </button>
                        <p class="content__text">
                            Так красиво сегодня на улице! Настоящая зима)) 
                            Вспоминается Бродский: «Поздно ночью, в уснувшей долине, 
                            на самом дне, в городке, занесенном снегом по ручку двери...» 
                        </p>
                        <span class="content__text-continuation">ещё</span>
                        <span class="content__text-time">2 часа назад</span>
                    </div>
                </div>
                <div class="main-content__post">
                    <div class="post__info">
                        <img src="../images/avatar-elizaveta.png" class="info__image-avatar" alt="Avatar Elizaveta" height="32" width="32">
                        <p class="info__text-avatar">Лиза Дёмина</p>
                    </div>
                    <div class="post__content">
                        <img src="../images/photo2.jpg" class="content__image" alt="Post photo" height="474" width="474">
                        <button class="content__reaction-active">
                            <img src="../images/like.png" class="content__image-reaction" alt="like" height="16" width="16">
                            534
                        </button>
                        <span class="content__text-time">1 день назад</span>
                    </div>
                </div>
            </div>
        </div>        
    </body>
</html>
